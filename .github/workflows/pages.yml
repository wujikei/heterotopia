name: Build and deploy the visual novel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify all story branches
        run: npm test
      - name: Build the website
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify reading controls and decoded portraits
        env:
          VN_TEST_TIMINGS: record
        run: |
          npm run test:interactions
          npm run test:sprites
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the HTTPS website
        id: deployment
        uses: actions/deploy-pages@v5
